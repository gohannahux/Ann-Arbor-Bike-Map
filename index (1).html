<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ann Arbor Bike Map</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,600;0,700;1,500&family=Young+Serif&display=swap">
<style>
/* Layout: one-screen illustrated map, pan and zoom, side panel for the clip */
:root{
  --paper:#fdf9f1; --paper2:#f9f0dd; --ink:#2f2a36; --ink2:#6e6168; --water:#9fc8e0; --water-ink:#3b7ba3; --grass:#a9b56c; --block:#fffaf0; --panel:#fbf5ea; --line:#dfd0b6;
  --hwy:#d9b8a4; --hwy2:#ecd5c6; --protected:#2e7a4b; --painted:#276ba3; --sharrow:#c0407f; --shared:#e5a117; --trail:#1c8d8d; --gravel:#9a6a38; --sidewalk:#d9412e; --other:#7c8693;
  --display:'Young Serif',Georgia,serif; --hand:'Figtree',system-ui,sans-serif; --small:'Figtree',system-ui,sans-serif;
}
html{color-scheme:light}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--small);font-size:16px;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));overflow:hidden}
.app{position:relative;height:100%;display:flex;min-width:0}
#stage{position:relative;flex:1;min-width:0;cursor:grab;touch-action:none;overflow:hidden}
#stage.drag{cursor:grabbing}
#map{width:100%;height:100%;display:block}
.title{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:12px;pointer-events:none}
.title h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(34px,6vw,64px);line-height:.9;letter-spacing:.04em;
  color:transparent;-webkit-text-stroke:1.6px var(--ink);text-transform:uppercase}
.title p{margin:6px 0 0;font-size:15px;color:var(--ink2)}
.legend{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:16px;display:grid;grid-template-columns:repeat(2,auto);gap:4px 18px;
  background:color-mix(in srgb,var(--paper) 86%,transparent);padding:10px 12px;border:1.5px solid var(--ink);border-radius:3px 9px 4px 10px;font-size:14px}
.legend span{display:flex;align-items:center;gap:8px;white-space:nowrap}
.legend i{width:30px;height:8px;border-radius:4px;display:inline-block}
.legend .dash{background:repeating-linear-gradient(90deg,currentColor 0 6px,transparent 6px 10px)!important;height:4px}
.zoom{position:absolute;right:14px;bottom:16px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:38px;height:38px;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);font:700 24px var(--hand);border-radius:4px 10px 5px 9px;cursor:pointer}
.zoom button:focus-visible,.close:focus-visible,.yt:focus-visible{outline:3px solid var(--painted);outline-offset:2px}
#tip{position:absolute;pointer-events:none;max-width:240px;background:var(--panel);border:1.5px solid var(--ink);border-radius:3px 10px 4px 9px;
  padding:7px 10px;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;z-index:5}
#tip.on{opacity:1;transform:none}
#tip b{display:block;font:700 17px var(--hand);line-height:1.1}
#tip em{display:block;font-style:normal;color:var(--ink2);font-size:13px;margin-top:2px}
#tip q{display:block;font:500 17px var(--hand);margin-top:4px;quotes:none;line-height:1.15}
.panel{width:0;overflow:hidden;background:var(--panel);border-left:1.5px solid var(--ink);transition:width .25s ease;flex:none}
.panel.open{width:min(380px,92vw)}
.panel-in{width:min(380px,92vw);height:100%;box-sizing:border-box;padding:16px 18px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.close{align-self:flex-end;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font:700 22px var(--hand);border-radius:4px 9px 4px 9px;padding:0 12px;cursor:pointer}
.phone{align-self:center;width:min(190px,52%);aspect-ratio:9/16;border:2px solid var(--ink);border-radius:20px 24px 19px 25px;position:relative;
  background:repeating-linear-gradient(135deg,var(--paper2) 0 10px,var(--paper) 10px 20px);display:grid;place-items:center}
.phone svg{width:56px;height:56px}
.phone small{position:absolute;bottom:10px;left:0;right:0;text-align:center;color:var(--ink2);font-size:15px}
.player{align-self:center;width:min(250px,100%);aspect-ratio:9/16;border:2px solid var(--ink);border-radius:14px;overflow:hidden;background:#000}
.player iframe{width:100%;height:100%;border:0;display:block}
.panel h2{margin:0;font:400 30px var(--display);line-height:1}
.meta{color:var(--ink2);font-size:15px;margin:0}
.say{font:700 20px var(--hand);line-height:1.1;margin:0}
.note{font-size:16px;margin:0;border-left:3px solid var(--ink);padding-left:10px}
.yt{display:inline-block;text-align:center;border:2px solid var(--ink);padding:6px 12px;border-radius:5px 12px 5px 11px;color:var(--ink);text-decoration:none;font:700 16px var(--hand)}
.yt:hover{background:var(--ink);color:var(--paper)}
.stars{letter-spacing:3px}
.hint{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:14px;font-size:13px;color:var(--ink2);text-align:right;pointer-events:none;max-width:200px}
.seg{cursor:pointer}
.seg .glow{transition:stroke-width .12s,opacity .12s;opacity:.55}
.seg:hover .glow,.seg.sel .glow,.seg:focus .glow{opacity:.95;stroke-width:6.5}
.seg:focus{outline:none}
.lbl{font-family:var(--hand);fill:var(--ink);pointer-events:none}
.mapnote{font-family:var(--small);font-style:italic;fill:var(--ink);pointer-events:none}
.faint{fill:var(--ink2)}
@media (max-width:700px){
  .app{flex-direction:column}
  .panel{width:100%;height:0;border-left:0;border-top:1.5px solid var(--ink);transition:height .25s ease}
  .panel.open{width:100%;height:56%}
  .panel-in{width:100%;flex-direction:row;flex-wrap:wrap;align-items:flex-start;gap:10px 14px}
  .phone{width:110px;align-self:flex-start}
  .player{width:140px;align-self:flex-start}
  .legend{grid-template-columns:auto;font-size:15px;padding:6px 8px;bottom:10px}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){.panel,#tip,.seg .glow{transition:none}}
</style>

</head>

    for(let k=1;k<=n;k++){const t=k/n;let x=a+(c-a)*t,y=b+(d-b)*t;if(k<n){x+=(rnd()-.5)*amp*2;y+=(rnd()-.5)*amp*2}o.push([x,y])}}

{const sm=smooth(RIVER,8).map(p=>[...P(p[0],p[1]),p[2]*SC*1.5]);const[L,R]=ribbon(sm);

const halo=t=>{t.style.paintOrder='stroke';t.style.stroke='var(--paper2)';t.style.strokeWidth='5px';t.style.strokeLinejoin='round'};
function label(txt,x,y,{ang=0,size=20,fam,ls=2,dx=0,dy=0}={}){const p=P(x,y),t=el('text',{class:'lbl',transform:'translate('+(p[0]+dx)+' '+(p[1]+dy)+') rotate('+ang+')','text-anchor':'middle','font-size':size,'letter-spacing':ls},gText);if(fam)t.style.fontFamily=fam;halo(t);t.textContent=txt}

// ---- roads and filmed routes: the earlier hand-placed grid, mapped onto the traced base ----
// anchors: old north-south position -> pixel y on the screenshot; east-west is a straight scale with a slight lean
const VA=[[-100,430],[120,575],[350,735],[470,820],[620,930],[680,985],[860,1240],[1000,1340]];
const pw=v=>{for(let i=1;i<VA.length;i++)if(v<=VA[i][0]||i===VA.length-1){const a=VA[i-1],b=VA[i];return a[1]+(v-a[0])/(b[0]-a[0])*(b[1]-a[1])}};
const toPx=(u,v)=>{const y=pw(v);return[588+(u-280)*.5+(y-735)*.1,y]};
const dens=(pts,step=18)=>{const o=[];for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],n=Math.max(1,Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/step));for(let k=0;k<n;k++)o.push([a[0]+(b[0]-a[0])*k/n,a[1]+(b[1]-a[1])*k/n])}o.push(pts[pts.length-1]);return o};
const mapPts=pts=>dens(pts).map(p=>P(...toPx(p[0],p[1])));
const MAJOR=new Set(['Main St','State St','Division St','Huron St','Washington St','Packard St','Stadium Blvd']);
const ST=[['Depot St',[[200,150],[520,150]]],['Kingsley St',[[280,220],[520,220]]],['Catherine St',[[280,270],[520,270]]],['Ann St',[[280,310],[520,310]]],
['Huron St',[[230,350],[640,350]]],['Washington St',[[230,390],[640,390]]],['Liberty St',[[230,430],[640,430]]],['Williams St',[[230,470],[640,470]]],
['Hill St',[[300,540],[700,540]]],['Packard St',[[300,620],[780,620]]],['Hoover Ave',[[300,680],[700,680]]],['Stadium Blvd',[[480,860],[880,860]]],
['Main St',[[280,150],[280,560]]],['Fourth Ave',[[335,150],[335,470]]],['Fifth Ave',[[385,150],[385,620]]],['Division St',[[450,220],[450,700]]],
['State St',[[560,270],[560,860]]],['Thompson St',[[505,430],[505,560]]],['Industrial Ave',[[800,740],[800,940]]],
['Detroit St',[[400,262],[470,170]]],['Broadway',[[470,170],[330,140]]],['Swift St',[[330,140],[345,80]]],['Pontiac Trail',[[345,80],[430,-40]]],
['Amherst',[[430,-40],[270,-35]]],['Longshore Dr',[[150,30],[215,75]]],['Longshore Dr ',[[270,-35],[260,-100]]]];
const gRoads=el('g');svg.insertBefore(gRoads,gHwy);
const gRoutes=el('g');svg.insertBefore(gRoutes,gText);
// campus quad
{const[a,b,c,d]=[585,392,792,538],q=[[a,b],[c,b],[c,d],[a,d]].map(p=>P(...toPx(...p)));
 el('path',{d:sketch(q,.6,14,true),fill:'var(--grass)',stroke:'var(--ink)','stroke-width':1,'stroke-linejoin':'round'},gRoads)}
ST.forEach(([n,pts])=>{const fp=mapPts(pts),w=MAJOR.has(n)?3:2.4;
  el('path',{d:sketch(fp,.5,12),fill:'none',stroke:'var(--ink)','stroke-width':w+1.1,'stroke-linecap':'round','stroke-linejoin':'round'},gRoads);
  el('path',{d:sketch(fp,.1,40),fill:'none',stroke:'var(--paper2)','stroke-width':w-.5,'stroke-linecap':'round','stroke-linejoin':'round'},gRoads)});
// routes
const DASH={trail:'5 3',gravel:'1.5 3',sidewalk:'3 3'},col=k=>'var(--'+k+')',segEls={};
C.forEach(c=>{
  const fp=mapPts(c.pts),d=sketch(fp,.35,10),ghost=!c.yt,color=ghost?'var(--ink2)':col(c.inf);
  const g=el('g',{class:'seg',tabindex:0,role:'button','aria-label':c.st+', '+c.dir+', '+INFRA[c.inf]+(ghost?', not uploaded yet':''),'data-id':c.id},gRoutes);
  if(!ghost)el('path',{class:'glow',d,fill:'none',stroke:color,'stroke-width':4,'stroke-linecap':'round','stroke-linejoin':'round'},g);
  el('path',{d,fill:'none',stroke:color,'stroke-width':ghost?1.2:1.9,'stroke-linecap':'round','stroke-linejoin':'round','stroke-dasharray':ghost?'1.5 3':(DASH[c.inf]||'none')},g);
  const e=fp[fp.length-1],pr=fp[Math.max(0,fp.length-3)],a=Math.atan2(e[1]-pr[1],e[0]-pr[0]),L=5.5,Wd=3.2;
  const tip=[e[0]+Math.cos(a)*3.5,e[1]+Math.sin(a)*3.5],b1=[tip[0]-Math.cos(a)*L-Math.sin(a)*Wd,tip[1]-Math.sin(a)*L+Math.cos(a)*Wd],b2=[tip[0]-Math.cos(a)*L+Math.sin(a)*Wd,tip[1]-Math.sin(a)*L-Math.cos(a)*Wd];
  el('polygon',{points:[tip,b1,b2].map(p=>p.map(x=>x.toFixed(1)).join(',')).join(' '),fill:color,stroke:'var(--paper)','stroke-width':.6,'stroke-linejoin':'round'},g);
  el('circle',{cx:fp[0][0],cy:fp[0][1],r:2.5,fill:ghost?'var(--paper)':color,stroke:ghost?'var(--ink2)':'var(--paper)','stroke-width':1},g);
  el('path',{d,fill:'none',stroke:'transparent','stroke-width':11,'stroke-linecap':'round'},g);
  segEls[c.id]=g});
// handwriting for the street grid
const O=(t,u,v,o)=>label(t,...toPx(u,v),o);
[['MAIN ST',268,520,-30],['FIFTH AVE',398,590,-30],['DIVISION ST',466,640,-30],['STATE ST',574,805,-30],['INDUSTRIAL AVE',826,830,-30],
 ['HURON ST',610,338,30],['WASHINGTON ST',618,378,30],['LIBERTY ST',262,417,30],['WILLIAMS ST',262,457,30],['HILL ST',340,527,30],['PACKARD ST',700,607,30],['HOOVER AVE',640,667,30],
 ['KINGSLEY ST',472,207,30],['DEPOT ST',472,137,30],['STADIUM BLVD',650,847,30]].forEach(([t,u,v,a])=>O(t,u,v,{ang:a,size:4.1,ls:.7}));
O('UNIVERSITY OF MICHIGAN',688,372,{size:6,ls:1.2});O('KERRYTOWN',432,194,{size:7,ls:1.5});O('LOWERTOWN',410,122,{size:6,ls:1.2});O('NORTHSIDE',330,-75,{size:8,ls:1.6});
O('BURNS PARK',870,690,{size:8,ls:1.6});O('SOUTHTOWN',640,762,{size:8,ls:1.6});O('DOWNTOWN',120,400,{size:8,ls:1.6,fam:'var(--display)'});
const NOTES=[[36,'cars parked in|the protected lane!',-30,12],[12,'Main St closed|for the summer',-32,-4],[17,'very dark',-24,-18],[35,'ends at the|sculpture plaza',-8,-24],
 [29,'sidewalk when|the road is rough',36,8],[3,'Phase 1 of the State St|reconfiguration: construction',34,-14],[5,'unpaved|by the river',-24,-10],[7,'the curvy B2B trail',-4,18],
 [2,'coffee at RoosRoast',-34,8],[9,'shortcut through|the Farmers Market',38,6],[24,'gravel again',-22,-6]];
NOTES.forEach(([id,txt,dx,dy])=>{
  const c=C.find(x=>x.id===id),fp=mapPts(c.pts),m=fp[Math.floor(fp.length/2)],tx=m[0]+dx,ty=m[1]+dy;
  const t=el('text',{class:'mapnote',transform:'translate('+tx.toFixed(1)+' '+ty.toFixed(1)+')','text-anchor':dx<0?'end':'start','font-size':6.6,'letter-spacing':.1},gText);halo(t);t.style.strokeWidth='3px';
  txt.split('|').forEach((s,i)=>{const sp=el('tspan',{x:0,dy:i?7:0},t);sp.textContent=s});
  const sx=tx+(dx<0?2:-2),sy=ty-3,ex=m[0]-Math.sign(dx)*2,ey=m[1]+(dy<0?-2:2);
  el('path',{d:'M'+sx+' '+sy+'Q'+((sx+ex)/2+(dy<0?4:-4))+' '+((sy+ey)/2+(dy<0?-3:3))+' '+ex+' '+ey,fill:'none',stroke:'var(--ink)','stroke-width':.6,'stroke-linecap':'round',opacity:.8},gText)});
// legend
{const lg=document.getElementById('legend');Object.keys(INFRA).forEach(k=>{const s=document.createElement('span'),i=document.createElement('i');if(DASH[k]){i.className='dash';i.style.color=col(k)}else i.style.background=col(k);s.append(i,INFRA[k]);lg.append(s)});
 const g=document.createElement('span'),i=document.createElement('i');i.className='dash';i.style.color='var(--ink2)';g.append(i,'not uploaded yet');lg.append(g)}

// ---- view: pan and zoom ----
const stage=document.getElementById('stage');
const BB=(()=>{let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;cs.forEach(p=>{x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1]+T)});return{x0,y0,x1,y1}})();
const V={cx:0,cy:0,w:1};let fitW=1;
const size=()=>({cw:stage.clientWidth||800,ch:stage.clientHeight||600});
function apply(){const{cw,ch}=size(),h=V.w*ch/cw;svg.setAttribute('viewBox',(V.cx-V.w/2).toFixed(1)+' '+(V.cy-h/2).toFixed(1)+' '+V.w.toFixed(1)+' '+h.toFixed(1))}
function fitAll(){const{cw,ch}=size();fitW=Math.max((BB.x1-BB.x0)*1.05,(BB.y1-BB.y0+120)*1.05*cw/ch);V.w=fitW;V.cx=(BB.x0+BB.x1)/2;V.cy=(BB.y0+BB.y1)/2+40;apply()}
function fit(){const{cw,ch}=size();fitAll();let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;C.forEach(c=>mapPts(c.pts).forEach(p=>{x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1])}));
  const pad=150,w=Math.max(x1-x0+pad*2,(y1-y0+pad*2+120)*cw/ch);V.w=w;V.cx=(x0+x1)/2;V.cy=(y0+y1)/2+60;apply()}
function zoomAt(f,px,py){const{cw,ch}=size(),w2=Math.min(fitW*1.15,Math.max(fitW/14,V.w*f)),upp=V.w/cw,wx=V.cx-V.w/2+px*upp,wy=V.cy-(V.w*ch/cw)/2+py*upp;V.w=w2;const u2=V.w/cw;V.cx=wx-px*u2+V.w/2;V.cy=wy-py*u2+(V.w*ch/cw)/2;apply()}
new ResizeObserver(apply).observe(stage);
document.getElementById('zin').onclick=()=>zoomAt(.7,size().cw/2,size().ch/2);
document.getElementById('zout').onclick=()=>zoomAt(1/.7,size().cw/2,size().ch/2);
document.getElementById('zreset').onclick=fit;document.getElementById('zall').onclick=fitAll;
stage.addEventListener('wheel',e=>{e.preventDefault();const r=stage.getBoundingClientRect();zoomAt(Math.exp(e.deltaY*.0015),e.clientX-r.left,e.clientY-r.top)},{passive:false});
const ptrs=new Map();let pinch=0,moved=0;
stage.addEventListener('pointerdown',e=>{if(e.target.closest('.zoom'))return;ptrs.set(e.pointerId,[e.clientX,e.clientY]);moved=0;stage.classList.add('drag');if(ptrs.size===2){const[a,b]=[...ptrs.values()];pinch=Math.hypot(a[0]-b[0],a[1]-b[1])}});
window.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;const p=ptrs.get(e.pointerId),dx=e.clientX-p[0],dy=e.clientY-p[1];ptrs.set(e.pointerId,[e.clientX,e.clientY]);moved+=Math.abs(dx)+Math.abs(dy);const upp=V.w/size().cw;
  if(ptrs.size===1){V.cx-=dx*upp;V.cy-=dy*upp;apply();if(typeof hideTip==='function')hideTip()}else if(ptrs.size===2){const[a,b]=[...ptrs.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]),r=stage.getBoundingClientRect();if(pinch)zoomAt(pinch/d,(a[0]+b[0])/2-r.left,(a[1]+b[1])/2-r.top);pinch=d}});
const up=e=>{ptrs.delete(e.pointerId);if(!ptrs.size)stage.classList.remove('drag');pinch=0};
window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
const tipEl=document.getElementById('tip'),panel=document.getElementById('panel'),panelIn=document.getElementById('panelIn');
// ---- hover tip + ride panel ----
const stars=q=>q?'<span class="stars" aria-label="quality '+q+' of 3">'+'★'.repeat(q)+'☆'.repeat(3-q)+'</span>':'';
const QW=['unrated','poor footage','good footage','great footage'];
const line=c=>c.hover||c.st+(c.from?', '+c.from+' to '+c.to:'');
function moveTip(e){const r=stage.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,w=tipEl.offsetWidth;
  tipEl.style.left=Math.min(Math.max(8,x+16),r.width-w-8)+'px';tipEl.style.top=Math.max(8,y-tipEl.offsetHeight-12)+'px'}
function hideTip(){tipEl.classList.remove('on')}
let selId=null;
function openClip(c){
  selId=c.id;Object.values(segEls).forEach(g=>g.classList.remove('sel'));segEls[c.id].classList.add('sel');
  const url=c.yt?'https://www.youtube.com/shorts/'+c.yt:'';
  panelIn.innerHTML='<button class="close" id="pclose" aria-label="Close">&times;</button>'+
  (c.yt?'<div class="player"><iframe src="https://www.youtube-nocookie.com/embed/'+c.yt+'?autoplay=1&rel=0&playsinline=1" title="'+c.st+', '+c.dir+'" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen loading="lazy"></iframe></div>':'<div class="phone" aria-hidden="true"><svg viewBox="0 0 56 56"><path d="M16 10 L46 28 L16 46 Z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/></svg><small>no video yet</small></div>')+
  '<div><h2>'+c.st+'</h2><p class="meta">'+c.dir+' · '+c.from+' to '+c.to+'</p><p class="meta">'+(c.hood?c.hood+' · ':'')+INFRA[c.inf]+' '+stars(c.q)+'</p></div>'+
  (c.hover?'<p class="say">'+c.hover+'</p>':'')+(c.note?'<p class="note">'+c.note+'</p>':'')+
  (url?'<a class="yt" href="'+url+'" target="_blank" rel="noopener">Open on YouTube &#8599;</a>':'<p class="meta">This one is filmed but not uploaded yet.</p>');
  panel.classList.add('open');document.getElementById('pclose').onclick=closePanel}
function closePanel(){panel.classList.remove('open');panelIn.innerHTML='';Object.values(segEls).forEach(g=>g.classList.remove('sel'));selId=null}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel()});
C.forEach(c=>{const g=segEls[c.id];
  g.addEventListener('pointerenter',e=>{if(ptrs.size)return;tipEl.innerHTML='<b>'+c.st+'</b><em>'+c.dir+' · '+INFRA[c.inf]+' '+stars(c.q)+'</em>'+(c.hover?'<q>'+c.hover+'</q>':'');tipEl.classList.add('on');moveTip(e)});
  g.addEventListener('pointerleave',hideTip);
  g.addEventListener('click',()=>{if(moved<6)openClip(c)});
  g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openClip(c)}})});
fit();
